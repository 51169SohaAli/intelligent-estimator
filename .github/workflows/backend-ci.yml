name: NestJS Backend CI

# 1. Trigger the workflow on pushes or pull requests to the main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 2. Pull down your code from GitHub into the virtual runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # 3. Setup Node.js environment
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Matches modern LTS Node versions
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'

    # 4. Install backend dependencies
    - name: Install Dependencies
      run: |
        cd backend
        npm ci

    # 5. Compile the TypeScript / NestJS application
    - name: Build NestJS Application
      run: |
        cd backend
        npm run build